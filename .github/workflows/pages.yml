name: Deploy Trend Pulse preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 7,19 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout persistent trend history
        uses: actions/checkout@v6
        with:
          ref: trend-history
          path: .trend-history-store
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Brand Profile foundation invariants
        run: npm run verify:brand-profile

      - name: Verify Workspace Intelligence navigation
        run: npm run verify:workspace-intelligence-ux

      - name: Collect global connector backbone
        run: npm run collect:backbone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect social signal backbone
        run: npm run collect:social
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Collect permissionless social expansion
        run: npm run collect:permissionless-social

      - name: Collect real Wikimedia signals
        run: npm run collect:wikimedia

      - name: Sanitize Signal contract semantics
        run: npm run sanitize:signals

      - name: Collect workspace-scoped signals
        run: npm run collect:workspace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve workspace intelligence
        run: npm run resolve:workspace-intelligence

      - name: Verify workspace source coverage and report invariants
        run: npm run verify:workspace-intelligence-data

      - name: Resolve cross-source Global Pulse Trend Candidates
        run: npm run resolve:trends

      - name: Calibrate derivative evidence
        run: npm run calibrate:trends

      - name: Verify Global Pulse Trend Candidate invariants
        run: npm run verify:trends

      - name: Build multi-cycle trend history
        run: npm run build:trend-history
        env:
          TREND_HISTORY_STATE_PATH: .trend-history-store/history/production-state.json
          TREND_HISTORY_CYCLE_PURPOSE: ${{ github.event_name == 'schedule' && 'scheduled' || 'qa' }}
          TREND_HISTORY_PERSISTENCE_ELIGIBLE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

      - name: Verify trend history invariants
        run: npm run verify:trend-history

      - name: Build static export
        run: npm run build

      - name: Persist verified scheduled trend history
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trend-history-store/history
          cp .trend-history-next/state.json .trend-history-store/history/production-state.json
          cp .trend-history-next/latest.json .trend-history-store/history/latest-production.json
          mkdir -p .trend-history-store/history/cycles .trend-history-store/history/snapshots
          cp .trend-history-next/cycles/*.json .trend-history-store/history/cycles/
          cp .trend-history-next/snapshots/*.json .trend-history-store/history/snapshots/
          cd .trend-history-store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "No scheduled trend history changes to persist."
          else
            git commit -m "data: persist scheduled trend cycle ${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT} [skip ci]"
            git push origin HEAD:trend-history
          fi

      - name: Confirm QA history isolation
        if: github.event_name != 'schedule'
        run: echo "QA cycle verified for artifact/preview only; canonical production-state.json was not advanced."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
